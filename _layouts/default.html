<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · {{ site.title }}</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --code-bg: #161b22;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--fg); margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 2rem 1.5rem 5rem;
    line-height: 1.7;
    font-size: 16px;
  }
  nav {
    border-bottom: 1px solid var(--border);
    padding: 0 0 1rem;
    margin-bottom: 2rem;
    display: flex;
    gap: 1.5rem;
    font-size: 0.9rem;
  }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3, h4 { color: var(--fg); margin-top: 1.8em; }
  h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border); padding-bottom: 0.4em; }
  blockquote {
    border-left: 3px solid var(--accent);
    margin: 1.2em 0;
    padding: 0.3em 1em;
    color: var(--muted);
    background: var(--code-bg);
  }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: "JetBrains Mono", Consolas, monospace;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1em;
    overflow-x: auto;
  }
  pre code { background: transparent; padding: 0; }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  ul, ol { padding-left: 1.5em; }
  footer {
    margin-top: 4em;
    padding-top: 1em;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85em;
  }
</style>
</head>
<body>
  <nav>
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="{{ site.baseurl }}/about">About</a>
    <a href="{{ site.baseurl }}/archive">Archive</a>
  </nav>

  {{ content }}

  <footer>
    Built with Jekyll · Hosted on GitHub Pages
  </footer>
</body>
</html>
