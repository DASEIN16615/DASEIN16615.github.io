<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ page.description | default: site.description }}">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<style>
  :root {
    /* Apple-style white-gold palette */
    --bg: #fbfaf7;             /* 暖白，象牙白 */
    --surface: #ffffff;        /* 卡片面，纯净白 */
    --fg: #1d1d1f;             /* Apple 近黑 */
    --muted: #6e6e73;          /* Apple 次级文本灰 */
    --accent: #bf8f5a;         /* 香槟金 */
    --accent-soft: #e7d4b8;
    --accent-deep: #8a6840;
    --border: #ececec;
    --code-bg: #f5f4f0;
    --code-fg: #4d3a1f;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 32px rgba(0,0,0,0.04);

    /* Type scale */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
            "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-serif: "New York", "Times New Roman", "Source Han Serif SC",
                  "Songti SC", "STSong", serif;
    --font-mono: "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body {
    font-family: var(--font);
    max-width: 720px;
    margin: 0 auto;
    padding: 5rem 1.5rem 6rem;
    line-height: 1.75;
    font-size: 17px;
    letter-spacing: 0.005em;
  }

  /* --- Nav --- */
  nav.site {
    border-bottom: 1px solid var(--border);
    padding: 0 0 1.25rem;
    margin-bottom: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  nav.site .brand {
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--fg);
    font-family: var(--font-serif);
    font-style: italic;
    text-transform: none;
    font-size: 1.05rem;
  }
  nav.site .brand::before {
    content: "✦";
    color: var(--accent);
    margin-right: 0.5em;
    font-style: normal;
  }
  nav.site .links { display: flex; gap: 1.8rem; }
  nav.site a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  nav.site a:hover { color: var(--accent-deep); }

  /* --- Headings --- */
  h1, h2, h3, h4 {
    color: var(--fg);
    margin-top: 1.8em;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  h1 {
    font-size: 2.4rem;
    line-height: 1.15;
    margin-top: 0;
    font-family: var(--font-serif);
    font-weight: 500;
    letter-spacing: -0.03em;
  }
  h2 {
    font-size: 1.5rem;
    margin-top: 2.6em;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.4em;
  }
  h3 {
    font-size: 1.2rem;
    color: var(--accent-deep);
    font-weight: 600;
  }

  /* --- Body text --- */
  p { margin: 1.2em 0; }

  blockquote {
    border-left: 2px solid var(--accent);
    margin: 1.8em 0;
    padding: 0.4em 1.4em;
    color: var(--muted);
    font-style: italic;
    background: rgba(231, 212, 184, 0.12);
    font-family: var(--font-serif);
  }

  /* --- Links --- */
  a {
    color: var(--accent-deep);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s, color 0.2s;
  }
  a:hover {
    border-bottom-color: var(--accent);
    color: var(--accent);
  }

  /* --- Lists --- */
  ul, ol { padding-left: 1.5em; }
  li { margin: 0.4em 0; }
  li::marker { color: var(--accent); }

  /* --- Code --- */
  code {
    background: var(--code-bg);
    color: var(--code-fg);
    padding: 0.12em 0.45em;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: var(--font-mono);
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2em 1.4em;
    overflow-x: auto;
    box-shadow: var(--shadow);
  }
  pre code {
    background: transparent;
    padding: 0;
    font-size: 0.85em;
    line-height: 1.6;
  }

  /* --- Horizontal rule --- */
  hr {
    border: 0;
    height: 1px;
    background: var(--border);
    margin: 3em 0;
    position: relative;
  }
  hr::after {
    content: "✦";
    position: absolute;
    left: 50%;
    top: -0.85em;
    transform: translateX(-50%);
    color: var(--accent);
    background: var(--bg);
    padding: 0 0.6em;
    font-size: 0.8rem;
  }

  /* --- Tables (if any) --- */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5em 0;
    font-size: 0.92em;
  }
  th, td {
    text-align: left;
    padding: 0.55em 0.8em;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.78em;
    letter-spacing: 0.06em;
  }

  /* --- Front-matter meta --- */
  .page-meta {
    color: var(--muted);
    font-size: 0.82em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 0.6em;
    margin-bottom: 2.5em;
  }

  /* --- Footer --- */
  footer.site {
    margin-top: 5rem;
    padding-top: 2em;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78em;
    letter-spacing: 0.06em;
    text-align: center;
    text-transform: uppercase;
  }
  footer.site .signature {
    font-family: var(--font-serif);
    font-style: italic;
    color: var(--accent);
    text-transform: none;
    font-size: 1em;
    letter-spacing: 0;
    margin-bottom: 0.4em;
  }

  /* --- Mobile --- */
  @media (max-width: 600px) {
    body { padding: 3rem 1.2rem 4rem; font-size: 16px; }
    h1 { font-size: 1.9rem; }
    nav.site { flex-direction: column; gap: 1rem; align-items: flex-start; }
    nav.site .links { gap: 1.2rem; }
  }
</style>
</head>
<body>
  <nav class="site">
    <span class="brand">DASEIN</span>
    <span class="links">
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="{{ site.baseurl }}/archive">Archive</a>
      <a href="{{ site.baseurl }}/about">About</a>
    </span>
  </nav>

  {{ content }}

  <footer class="site">
    <div class="signature">DASEIN1011</div>
    {{ site.title }} · {{ site.time | date: '%Y' }}
  </footer>
</body>
</html>
